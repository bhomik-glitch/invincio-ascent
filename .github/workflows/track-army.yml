name: Track Army notifications

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Selftest filters
        run: node scripts/track-army.mjs --selftest

      - name: Fetch + curate + publish
        run: node scripts/track-army.mjs

      - name: Commit if the feed changed
        run: |
          if [[ -n "$(git status --porcelain src/data/army-feed.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/army-feed.json
            git commit -m "chore(notifications): sync Army notifications feed [skip ci]"
            git push
          else
            echo "No feed changes."
          fi
